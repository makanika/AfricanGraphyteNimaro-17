<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimaro — The Seventeen Issue</title>
<style>
  :root{ --ink:#1C1A16; }
  *{box-sizing:border-box}
  body{margin:0;background:#15131d;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Jost,sans-serif}
  .bar{
    position:sticky;top:0;z-index:5;background:rgba(21,19,29,.92);backdrop-filter:blur(6px);
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 5vw;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#cfc8e0;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .bar strong{color:#fff;letter-spacing:.06em}
  .pages{max-width:760px;margin:0 auto;padding:40px 4vw 90px;display:flex;flex-direction:column;gap:38px}
  .page{position:relative}
  .page img{width:100%;display:block;border-radius:2px;box-shadow:0 30px 70px rgba(0,0,0,.55);}
  .page .no{position:absolute;bottom:-26px;right:4px;font-size:11px;color:#8d85a3;letter-spacing:.08em}
  footer{text-align:center;padding:50px 6vw 70px;font-size:11px;letter-spacing:.1em;color:#8d85a3;text-transform:uppercase}
</style>
</head>
<body>
  <div class="bar">
    <strong>NIMARO</strong>
    <span>The Seventeen Issue · 17 Pages</span>
  </div>
  <div class="pages">
